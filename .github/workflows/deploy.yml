name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 交易日每小时更新一次（北京时间 9:30-15:30 期间）
    - cron: '30 1 * * 1-5'   # 北京时间 9:30
    - cron: '0 2 * * 1-5'    # 北京时间 10:00
    - cron: '30 2 * * 1-5'   # 北京时间 10:30
    - cron: '0 3 * * 1-5'    # 北京时间 11:00
    - cron: '30 3 * * 1-5'   # 北京时间 11:30
    - cron: '0 5 * * 1-5'    # 北京时间 13:00
    - cron: '30 5 * * 1-5'   # 北京时间 13:30
    - cron: '0 6 * * 1-5'    # 北京时间 14:00
    - cron: '30 6 * * 1-5'   # 北京时间 14:30
    - cron: '0 7 * * 1-5'    # 北京时间 15:00
    - cron: '0 8 * * 1-5'    # 北京时间 16:00 (收盘后)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests --break-system-packages

      - name: Fetch radar data
        run: |
          python3 scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config --global user.name 'Radar Bot'
          git config --global user.email 'radar@bot.local'
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "自动更新数据: $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
